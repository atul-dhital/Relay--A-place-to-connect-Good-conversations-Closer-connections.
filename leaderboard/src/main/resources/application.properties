spring.application.name=leaderboard
server.port=${PORT:8090}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
leaderboard.key-prefix=${LEADERBOARD_PREFIX:lb:{leaderboard}:}
leaderboard.session-seconds=${SESSION_SECONDS:86400}
spring.mvc.async.request-timeout=1800000

logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.redis=INFO
logging.level.io.lettuce=INFO
